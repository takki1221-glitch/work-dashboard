<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作進度 Dashboard｜Apple 行銷部 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --g:#1d9e75;--g2:#0f6e56;--gl:#e1f5ee;
  --bg:#f5f6f8;--card:#fff;--border:#e4e6ea;
  --t1:#1a1d23;--t2:#5f6470;--t3:#9da4ae;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;}

/* header */
.hdr{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.75rem;position:sticky;top:0;z-index:60;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);}
.htitle{font-size:15px;font-weight:700;}
.hsub{font-size:11px;color:var(--t3);margin-left:4px;}
.hdr-r{display:flex;align-items:center;gap:10px;}
.hupdate{font-size:11px;color:var(--t3);}
.btn-ref{font-size:11px;padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t2);cursor:pointer;transition:all .15s;}
.btn-ref:hover{border-color:var(--g);color:var(--g);}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:1.5rem 1.75rem;}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem;}
.mc{background:var(--card);border-radius:var(--r);padding:.9rem 1.1rem;box-shadow:var(--sh);border:1px solid var(--border);position:relative;overflow:hidden;}
.mc::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--mc,var(--g));border-radius:4px 0 0 4px;}
.mc-l{font-size:11px;color:var(--t3);font-weight:500;margin-bottom:5px;}
.mc-v{font-size:26px;font-weight:700;color:var(--mc,var(--t1));}
.mc-s{font-size:11px;color:var(--t3);margin-top:3px;}

/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem;}
.cc{background:var(--card);border-radius:var(--r);padding:1.1rem 1.25rem;box-shadow:var(--sh);border:1px solid var(--border);}
.cc-t{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:10px;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);}
.legdot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.sec-t{font-size:12px;font-weight:600;color:var(--t1);margin-right:4px;}
.fb{font-size:11px;padding:3px 11px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;}
.fb:hover{border-color:var(--g);color:var(--g);}
.fb.on{background:var(--g);color:#fff;border-color:transparent;}
.msel{font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t2);}
.srch{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t1);width:160px;margin-left:auto;}
.srch:focus{outline:none;border-color:var(--g);}

/* cards */
.cards{display:flex;flex-direction:column;gap:7px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:#b8ddd1;box-shadow:0 2px 12px rgba(29,158,117,.08);}
.card-hd{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;user-select:none;}
.pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.sa{background:#e1f5ee;color:#0f6e56;}
.sd{background:#eaf3de;color:#3b6d11;}
.sp{background:#faeeda;color:#854f0b;}
.sh2{background:#fbeaf0;color:#993556;}
.btag{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--t2);border:1px solid var(--border);white-space:nowrap;}
.cname{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.clatest{font-size:11px;color:var(--t3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow{display:flex;align-items:center;gap:7px;min-width:120px;}
.pbar-bg{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;}
.pbar-fg{height:100%;border-radius:3px;transition:width .4s;}
.ptxt{font-size:10px;color:var(--t3);white-space:nowrap;min-width:30px;text-align:right;}
.chev{font-size:13px;color:var(--t3);transition:transform .2s;flex-shrink:0;}
.chev.open{transform:rotate(180deg);}

/* card body */
.card-bd{display:none;border-top:1px solid var(--border);padding:14px 16px;}
.card-bd.open{display:block;}
.bd-prog{margin-bottom:12px;}
.bd-pbar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:4px;}
.bd-pfg{height:100%;border-radius:4px;transition:width .5s;}
.bd-plabel{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);}
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.blbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.steps{display:flex;flex-direction:column;gap:5px;}
.step{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2);}
.sdot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;margin-top:.5px;}
.sdot.done{background:var(--g);border-color:var(--g);color:#fff;}
.sdot.curr{background:#fff;border-color:var(--g);color:var(--g);font-size:8px;}
.slbl.done{text-decoration:line-through;color:var(--t3);}
.slbl.curr{color:var(--g2);font-weight:500;}
.logs{display:flex;flex-direction:column;gap:6px;}
.log{display:flex;gap:8px;font-size:12px;}
.logdot{width:5px;height:5px;border-radius:50%;background:var(--g);flex-shrink:0;margin-top:4px;}
.logtxt{color:var(--t2);line-height:1.5;}
.empty-note{font-size:12px;color:var(--t3);font-style:italic;}

/* loading / notice */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:3rem;color:var(--t3);font-size:13px;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.notice{background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1.25rem;font-size:12px;line-height:1.9;color:#92400e;}
.notice strong{display:block;font-size:13px;margin-bottom:4px;}
.notice code{background:#fef3c7;padding:1px 5px;border-radius:3px;font-family:monospace;}

@media(max-width:768px){
  .metrics{grid-template-columns:repeat(2,1fr);}
  .charts{grid-template-columns:1fr;}
  .bd-grid{grid-template-columns:1fr;}
  .wrap{padding:1rem;}
}
</style>
</head>

async function loadData(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('main').style.display='none';
  if(SHEET_CSV_URL==='YOUR_GOOGLE_SHEETS_CSV_URL_HERE'){useDemo();return;}
  try{
    const r=await fetch(SHEET_CSV_URL);
    const t=await r.text();
    parseCSV(t);
  }catch(e){useDemo();}
}

function parseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2){useDemo();return;}
  // cols: 品牌,案件名稱,狀態,開始月份,結束月份,進度覆蓋,待辦步驟,進度記錄
  TASKS=lines.slice(1).map((line,i)=>{
    const cols=[];let cur='',inQ=false;
    for(const ch of line){if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){cols.push(cur);cur='';}else cur+=ch;}
    cols.push(cur);
    const c=cols.map(x=>x.trim().replace(/^"|"$/g,''));
    const stepsRaw=(c[6]||'').split('|').filter(s=>s.trim());
    const done=stepsRaw.filter(s=>s.trim().startsWith('✓')).length;
    const steps=stepsRaw.map(s=>s.replace(/^✓\s*/,'').trim());
    const override=c[5]?parseInt(c[5]):null;
    const pct=override!=null?override:(steps.length?Math.round(done/steps.length*100):(c[2]==='已完成'||c[2]==='已結案'?100:0));
    const logs=(c[7]||'').split('|').map(l=>l.trim()).filter(Boolean);
    return {
      brand:c[0],name:c[1],status:c[2],
      startM:parseInt(c[3])||1,endM:c[4]?parseInt(c[4]):null,
      steps,completedSteps:done,pct,log:logs,latest:logs[0]||''
    };
  }).filter(t=>t.brand&&t.name);
  document.getElementById('hupdate').textContent='更新：'+new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  init();
}

function useDemo(){
  TASKS=DEMO;
  document.getElementById('hupdate').textContent='示範模式（尚未連接試算表）';
  init();
}

function init(){
  // Build months from data
  const ms=new Set();
  TASKS.forEach(t=>{
    for(let m=t.startM;m<=(t.endM||12);m++) ms.add(m);
  });
  MONTHS=[...ms].sort((a,b)=>a-b);
  // month selector
  const sel=document.getElementById('mSel');
  sel.innerHTML='<option value="all">全部月份</option>'+MONTHS.map(m=>`<option value="${m}">${MONTH_LABEL[m]||m+'月'}</option>`).join('');
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';
  render();
}

function taskInMonth(t,m){
  if(m==='all')return true;
  const mi=parseInt(m);
  return t.startM<=mi&&(t.endM==null||t.endM>=mi);
}

function filtered(){
  return TASKS.filter(t=>{
    const mOk=taskInMonth(t,mon);
    const sOk=filt==='all'||t.status===filt||(filt==='已完成'&&t.status==='已結案');
    const qOk=!srch||(t.brand+t.name).toLowerCase().includes(srch.toLowerCase());
    return mOk&&sOk&&qOk;
  });
}

function base(){return mon==='all'?TASKS:TASKS.filter(t=>taskInMonth(t,mon));}

function render(){
  const list=filtered(),b=base();
  renderMetrics(list);
  renderCharts(b);
  renderCards(list);
}

function renderMetrics(list){
  const n=list.length,a=list.filter(t=>t.status==='進行中').length,
    d=list.filter(t=>['已完成','已結案'].includes(t.status)).length,
    p=list.filter(t=>['暫停中','暫緩'].includes(t.status)).length;
  document.getElementById('mRow').innerHTML=`
    <div class="mc" style="--mc:#1a1d23"><div class="mc-l">總案件</div><div class="mc-v">${n}</div><div class="mc-s">目前篩選</div></div>
    <div class="mc" style="--mc:#0f6e56"><div class="mc-l">進行中</div><div class="mc-v">${a}</div><div class="mc-s">${n?Math.round(a/n*100):0}%</div></div>
    <div class="mc" style="--mc:#3b6d11"><div class="mc-l">已完成</div><div class="mc-v">${d}</div><div class="mc-s">${n?Math.round(d/n*100):0}%</div></div>
    <div class="mc" style="--mc:#854f0b"><div class="mc-l">暫停/暫緩</div><div class="mc-v">${p}</div><div class="mc-s">${n?Math.round(p/n*100):0}%</div></div>`;
}

function renderCharts(base){
  const bc={};base.forEach(t=>{bc[t.brand]=(bc[t.brand]||0)+1;});
  const sorted=Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(cBrand)cBrand.destroy();
  cBrand=new Chart(document.getElementById('cBrand'),{type:'bar',
    data:{labels:sorted.map(x=>x[0]),datasets:[{data:sorted.map(x=>x[1]),backgroundColor:sorted.map((_,i)=>BC[i%BC.length]),borderRadius:4,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.raw+' 件'}}},scales:{x:{ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}},y:{ticks:{font:{size:10}}}}}
  });

  const sc={};base.forEach(t=>{const k=t.status==='已結案'?'已完成':t.status;sc[k]=(sc[k]||0)+1;});
  const se=Object.entries(sc);const scols=se.map(([k])=>PC[k]||'#888');
  if(cDonut)cDonut.destroy();
  cDonut=new Chart(document.getElementById('cDonut'),{type:'doughnut',
    data:{labels:se.map(x=>x[0]),datasets:[{data:se.map(x=>x[1]),backgroundColor:scols,borderWidth:2,borderColor:'#fff',hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw} 件`}}}}
  });
  document.getElementById('donutLeg').innerHTML=se.map(([k,v],i)=>`<div class="leg"><div class="legdot" style="background:${scols[i]}"></div>${k} <strong>${v}</strong></div>`).join('');

  const bm=MONTHS.map(m=>({
    label:MONTH_LABEL[m]||m+'月',
    total:TASKS.filter(t=>taskInMonth(t,m)).length,
    active:TASKS.filter(t=>taskInMonth(t,m)&&t.status==='進行中').length,
    done:TASKS.filter(t=>taskInMonth(t,m)&&['已完成','已結案'].includes(t.status)).length,
  }));
  const ml=bm.map(m=>m.label);
  if(cLine)cLine.destroy();
  cLine=new Chart(document.getElementById('cLine'),{type:'line',
    data:{labels:ml,datasets:[{label:'總案件數',data:bm.map(m=>m.total),borderColor:'#1d9e75',backgroundColor:'rgba(29,158,117,.08)',tension:.35,pointRadius:4,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:2,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}},x:{ticks:{font:{size:10}}}}}
  });
  if(cStack)cStack.destroy();
  cStack=new Chart(document.getElementById('cStack'),{type:'bar',
    data:{labels:ml,datasets:[
      {label:'進行中',data:bm.map(m=>m.active),backgroundColor:'#1d9e75',borderRadius:3,stack:'s'},
      {label:'已完成',data:bm.map(m=>m.done),backgroundColor:'#639922',borderRadius:3,stack:'s'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10},boxWidth:10}}},scales:{x:{stacked:true,ticks:{font:{size:10}}},y:{stacked:true,beginAtZero:true,ticks:{stepSize:2,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}}}}
  });
}

function renderCards(list){
  const el=document.getElementById('cardList');
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--t3);font-size:13px;">無符合條件的案件</div>';return;}
  el.innerHTML=list.map((t,i)=>{
    const col=PC[t.status]||'#888';
    const stepsHtml=t.steps.length?t.steps.map((s,si)=>{
      const done=si<t.completedSteps,curr=si===t.completedSteps&&t.status==='進行中';
      return `<div class="step"><div class="sdot ${done?'done':curr?'curr':''}">${done?'✓':curr?'▶':''}</div><span class="slbl ${done?'done':curr?'curr':''}">${s}</span></div>`;
    }).join(''):'<div class="empty-note">無步驟資料</div>';
    const logHtml=t.log.length?t.log.slice(0,6).map(l=>`<div class="log"><div class="logdot"></div><div class="logtxt">${l}</div></div>`).join(''):'<div class="empty-note">尚無進度記錄</div>';
    const spanTxt=t.endM?`${MONTH_LABEL[t.startM]||t.startM+'月'} → ${MONTH_LABEL[t.endM]||t.endM+'月'}`:`${MONTH_LABEL[t.startM]||t.startM+'月'} 起`;
    return `<div class="card">
      <div class="card-hd" onclick="toggle(${i})">
        <span class="pill ${SC[t.status]||'sa'}">${t.status}</span>
        <span class="btag">${t.brand}</span>
        <span class="cname">${t.name}</span>
        <span class="clatest" style="color:var(--t3);font-size:10px;">${spanTxt}</span>
        <span class="clatest">${t.latest||'—'}</span>
        <div class="prow">
          <div class="pbar-bg"><div class="pbar-fg" style="width:${t.pct}%;background:${col}"></div></div>
          <span class="ptxt">${t.pct}%</span>
        </div>
        <span class="chev" id="chev-${i}">▾</span>
      </div>
      <div class="card-bd" id="bd-${i}">
        <div class="bd-prog">
          <div class="bd-pbar"><div class="bd-pfg" style="width:${t.pct}%;background:${col}"></div></div>
          <div class="bd-plabel"><span>${t.steps.length?`第 ${Math.min(t.completedSteps,t.steps.length)} / ${t.steps.length} 步`:'—'}</span><span>${t.pct}% 完成</span></div>
        </div>
        <div class="bd-grid">
          <div><div class="blbl">執行步驟</div><div class="steps">${stepsHtml}</div></div>
          <div><div class="blbl">進度記錄</div><div class="logs">${logHtml}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i){
  document.getElementById('bd-'+i).classList.toggle('open');
  document.getElementById('chev-'+i).classList.toggle('open');
}

document.getElementById('mSel').addEventListener('change',e=>{mon=e.target.value;render();});
document.getElementById('srch').addEventListener('input',e=>{srch=e.target.value;render();});
document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');filt=b.dataset.f;render();
}));

loadData();
</script>
</body>
</html>
