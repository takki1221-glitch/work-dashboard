<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作進度 Dashboard｜Apple 行銷部 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 換成你的 Google Sheets CSV 網址 ══ */
:root{
  --g:#1d9e75;--g2:#0f6e56;--gl:#e1f5ee;
  --bg:#f5f6f8;--card:#fff;--border:#e4e6ea;
  --t1:#1a1d23;--t2:#5f6470;--t3:#9da4ae;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;}

/* header */
.hdr{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.75rem;position:sticky;top:0;z-index:60;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);}
.htitle{font-size:15px;font-weight:700;}
.hsub{font-size:11px;color:var(--t3);margin-left:4px;}
.hdr-r{display:flex;align-items:center;gap:10px;}
.hupdate{font-size:11px;color:var(--t3);}
.btn-ref{font-size:11px;padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t2);cursor:pointer;transition:all .15s;}
.btn-ref:hover{border-color:var(--g);color:var(--g);}

/* tabs nav */
.tab-nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 1.75rem;display:flex;gap:0;}
.tab-btn{font-size:12px;font-weight:500;padding:12px 18px;border:none;background:transparent;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
.tab-btn:hover{color:var(--t1);}
.tab-btn.on{color:var(--g2);border-bottom-color:var(--g);}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:1.5rem 1.75rem;}
.tab-sec{display:none;}.tab-sec.on{display:block;}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem;}
.mc{background:var(--card);border-radius:var(--r);padding:.9rem 1.1rem;box-shadow:var(--sh);border:1px solid var(--border);position:relative;overflow:hidden;}
.mc::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--mc,var(--g));border-radius:4px 0 0 4px;}
.mc-l{font-size:11px;color:var(--t3);font-weight:500;margin-bottom:5px;}
.mc-v{font-size:26px;font-weight:700;color:var(--mc,var(--t1));}
.mc-s{font-size:11px;color:var(--t3);margin-top:3px;}

/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem;}
.cc{background:var(--card);border-radius:var(--r);padding:1.1rem 1.25rem;box-shadow:var(--sh);border:1px solid var(--border);}
.cc-t{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:10px;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);}
.legdot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.sec-t{font-size:12px;font-weight:600;color:var(--t1);margin-right:4px;}
.fb{font-size:11px;padding:3px 11px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;}
.fb:hover{border-color:var(--g);color:var(--g);}
.fb.on{background:var(--g);color:#fff;border-color:transparent;}
.msel{font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t2);}
.srch{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t1);width:160px;margin-left:auto;}
.srch:focus{outline:none;border-color:var(--g);}

/* cards */
.cards{display:flex;flex-direction:column;gap:7px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:#b8ddd1;box-shadow:0 2px 12px rgba(29,158,117,.08);}
.card-hd{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;user-select:none;}
.pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.sa{background:#fef9c3;color:#92700a;}
.sd{background:#dbeafe;color:#1d4ed8;}
.sp{background:#e5e7eb;color:#374151;}
.sw{background:#fce7f3;color:#be185d;}
.ss{background:#f0f0f0;color:#555;}
.btag{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--t2);border:1px solid var(--border);white-space:nowrap;}
.cname{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.clatest{font-size:11px;color:var(--t3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow{display:flex;align-items:center;gap:7px;min-width:120px;}
.pbar-bg{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;}
.pbar-fg{height:100%;border-radius:3px;transition:width .4s;}
.ptxt{font-size:10px;color:var(--t3);white-space:nowrap;min-width:30px;text-align:right;}
.chev{font-size:13px;color:var(--t3);transition:transform .2s;flex-shrink:0;}
.chev.open{transform:rotate(180deg);}

/* card body */
.card-bd{display:none;border-top:1px solid var(--border);padding:14px 16px;}
.card-bd.open{display:block;}
.bd-prog{margin-bottom:12px;}
.bd-pbar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:4px;}
.bd-pfg{height:100%;border-radius:4px;transition:width .5s;}
.bd-plabel{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);}
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.blbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.steps{display:flex;flex-direction:column;gap:5px;}
.step{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2);}
.sdot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;margin-top:.5px;}
.sdot.done{background:var(--g);border-color:var(--g);color:#fff;}
.sdot.curr{background:#fff;border-color:var(--g);color:var(--g);font-size:8px;}
.slbl.done{text-decoration:line-through;color:var(--t3);}
.slbl.curr{color:var(--g2);font-weight:500;}
.logs{display:flex;flex-direction:column;gap:6px;}
.log{display:flex;gap:8px;font-size:12px;}
.logdot{width:5px;height:5px;border-radius:50%;background:var(--g);flex-shrink:0;margin-top:4px;}
.logtxt{color:var(--t2);line-height:1.5;}
.empty-note{font-size:12px;color:var(--t3);font-style:italic;}
.deadline-tag{font-size:10px;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.deadline-ok{background:#f0f0f0;color:#5f6470;}
.deadline-urgent{background:#fef9c3;color:#92700a;}
.deadline-overdue{background:#fee2e2;color:#b91c1c;}
.view-toggle{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:3px;margin-left:8px;}
.vt-btn{font-size:11px;padding:4px 14px;border-radius:99px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;white-space:nowrap;}
.vt-btn.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500;}

/* Gantt */
.gantt-wrap{overflow-x:auto;margin-top:4px;}
.gantt-table{border-collapse:collapse;min-width:100%;}
.gantt-table th{font-size:10px;font-weight:600;color:var(--t3);padding:4px 8px;text-align:center;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
.gantt-table th.task-col{text-align:left;min-width:200px;}
.gantt-table th.month-col{min-width:60px;}
.gantt-table td{padding:3px 4px;vertical-align:middle;border-bottom:1px solid var(--border);}
.gantt-table td.task-label{padding:6px 8px;font-size:12px;color:var(--t1);white-space:nowrap;}
.gantt-table td.task-brand-label{font-size:10px;color:var(--t3);}
.gantt-bar-cell{text-align:center;padding:4px 2px;}
.gantt-bar{height:16px;border-radius:3px;display:inline-block;width:90%;vertical-align:middle;}
.gantt-bar.empty{background:transparent;}

/* Monthly report */
.month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
.mtab{font-size:11px;padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;}
.mtab:hover{border-color:var(--g);color:var(--g);}
.mtab.on{background:var(--g);color:#fff;border-color:transparent;}
.month-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.25rem;}

/* loading */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:3rem;color:var(--t3);font-size:13px;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.notice{background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1.25rem;font-size:12px;line-height:1.9;color:#92400e;}
.notice strong{display:block;font-size:13px;margin-bottom:4px;}
.notice code{background:#fef3c7;padding:1px 5px;border-radius:3px;font-family:monospace;}

@media(max-width:768px){
  .metrics{grid-template-columns:repeat(2,1fr);}
  .charts{grid-template-columns:1fr;}
  .bd-grid{grid-template-columns:1fr;}
  .wrap{padding:1rem;}
  .tab-btn{padding:10px 12px;font-size:11px;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <div class="dot"></div>
    <span class="htitle">工作進度 Dashboard</span>
    <span class="hsub">Apple 行銷部 2025</span>
  </div>
  <div class="hdr-r">
    <span class="hupdate" id="hupdate">—</span>
    <div class="view-toggle">
      <button class="vt-btn on" id="vt-all" onclick="setView('active')">現役案件</button>
      <button class="vt-btn" id="vt-active" onclick="setView('all')">含封存</button>
    </div>
    <button class="btn-ref" onclick="loadData()">↻ 重新整理</button>
  </div>
</header>

<nav class="tab-nav">
  <button class="tab-btn on" onclick="switchTab('overview',this)">📊 總覽</button>
  <button class="tab-btn" onclick="switchTab('tasks',this)">📋 案件清單</button>
  <button class="tab-btn" onclick="switchTab('gantt',this)">📅 時間軸</button>
  <button class="tab-btn" onclick="switchTab('monthly',this)">🗓 月份報表</button>
</nav>

<div class="wrap">


  <div id="main" style="display:none">

    <!-- 總覽 -->
    <div id="tab-overview" class="tab-sec on">
      <div class="metrics" id="mRow" style="grid-template-columns:repeat(5,1fr)"></div>
      <div class="charts">
        <div class="cc"><div class="cc-t">各品牌案件數（橫條圖）</div><div style="position:relative;height:220px"><canvas id="cBrand"></canvas></div></div>
        <div class="cc"><div class="cc-t">狀態分布（環形圖）</div><div class="legend" id="donutLeg"></div><div style="position:relative;height:180px"><canvas id="cDonut"></canvas></div></div>
        <div class="cc"><div class="cc-t">各月份工作量趨勢（以開始月份計）</div><div style="position:relative;height:180px"><canvas id="cLine"></canvas></div></div>
        <div class="cc"><div class="cc-t">進行中 vs 已完成（各月份堆疊）</div><div style="position:relative;height:180px"><canvas id="cStack"></canvas></div></div>
      </div>
    </div>

    <!-- 案件清單 -->
    <div id="tab-tasks" class="tab-sec">
      <div class="toolbar">
        <span class="sec-t">案件清單</span>
        <button class="fb on" data-f="all">全部</button>
        <button class="fb" data-f="進行中">進行中</button>
        <button class="fb" data-f="已完成">已完成</button>

        <input class="srch" id="srch" type="text" placeholder="搜尋品牌或案件…">
      </div>
      <div class="cards" id="cardList"></div>
    </div>

    <!-- 甘特圖 -->
    <div id="tab-gantt" class="tab-sec">
      <div class="cc">
        <div class="cc-t">任務時間軸（甘特圖）
          <span style="font-size:10px;font-weight:400;color:var(--t3);margin-left:8px;">— 每格代表一個月，色塊表示案件執行期間</span>
        </div>
        <div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;">
          <span class="leg"><span class="legdot" style="background:#EAB308"></span>進行中</span>
          <span class="leg"><span class="legdot" style="background:#3B82F6"></span>已完成/已結案</span>
          <span class="leg"><span class="legdot" style="background:#6B7280"></span>暫停</span>
        </div>
        <div class="gantt-wrap" id="ganttWrap"></div>
      </div>
    </div>

    <!-- 月份報表 -->
    <div id="tab-monthly" class="tab-sec">
      <div class="month-tabs" id="monthTabs"></div>
      <div id="monthContent"></div>
    </div>

  </div>
  <div class="loading" id="loading"><div class="spinner"></div>載入資料中…</div>
</div>

function deadlineInfo(dl){
  if(!dl)return null;
  const parts=dl.split('/');
  if(parts.length<2)return{txt:dl,days:null,urgent:false,overdue:false};
  const now=new Date();now.setHours(0,0,0,0);
  const y=parts.length===3?parseInt(parts[0]):(now.getFullYear());

  const urgent=!overdue&&days<=7;

}

// ── 讀取資料 ──
async function loadData(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('main').style.display='none';
  if(SHEET_CSV_URL==='YOUR_GOOGLE_SHEETS_CSV_URL_HERE'){useDemo();return;}
  try{
    const r=await fetch(SHEET_CSV_URL);
    const t=await r.text();
    parseCSV(t);
  }catch(e){useDemo();}
}

function parseCSV(text){
  // 處理 CSV 欄位內換行（用引號包覆的多行內容）
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(inQ&&text[i+1]==='"'){cur+='"';i++;}
      else inQ=!inQ;
    }else if(ch===','&&!inQ){row.push(cur);cur='';}
    else if((ch==='\n'||ch==='\r')&&!inQ){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);rows.push(row);row=[];cur='';
    }else{cur+=ch.replace(/\r/g,'');}
  }
  if(cur||row.length)rows.push([...row,cur]);
  const dataRows=rows.slice(1).filter(r=>r.length>1&&r[0]);
  if(!dataRows.length){useDemo();return;}
  TASKS=dataRows.map(cols=>{
    const c=cols.map(x=>x.trim());
    const c=cols.map(x=>x.trim().replace(/^"|"$/g,''));
    const stepsRaw=(c[6]||'').split('|').filter(s=>s.trim());
    const done=stepsRaw.filter(s=>s.trim().startsWith('✓')).length;
    const steps=stepsRaw.map(s=>s.replace(/^✓\s*/,'').trim());
    const override=c[5]?parseInt(c[5]):null;
    const pct=override!=null?override:(steps.length?Math.round(done/steps.length*100):(['已完成','已結案'].includes(c[2])?100:0));
    const logs=(c[7]||'').split('|').map(l=>l.trim()).filter(Boolean);
    const deadline=(c[8]||'').trim();
    const archived=(c[9]||'').trim().toUpperCase()==='Y';
    const waitNote=(c[11]||'').trim();
    return{brand:c[0],name:c[1],status:c[2],startM:parseInt(c[3])||1,endM:c[4]?parseInt(c[4]):null,steps,completedSteps:done,pct,log:logs,latest:logs[0]||'',deadline,archived,waitNote};
  }).filter(t=>t.brand&&t.name);
  // Sheets 順序直接保留（支援最新案件放最上方的填寫方式）
  document.getElementById('hupdate').textContent='更新：'+new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  init();
}

function useDemo(){TASKS=DEMO;document.getElementById('hupdate').textContent='示範模式（尚未連接試算表）';init();}

function init(){
  // 月份：只用 startM（每案件只計一次，不重複）
  const ms=new Set();
  TASKS.forEach(t=>ms.add(t.startM));
  ALL_MONTHS=[...ms].sort((a,b)=>a-b);
  curMonthTab=ALL_MONTHS[ALL_MONTHS.length-1]||1;

  const sel=document.getElementById('mSel');
  sel.innerHTML='<option value="all">全部月份</option>'+ALL_MONTHS.map(m=>`<option value="${m}">${ML[m]||m+'月'}</option>`).join('');

  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';
  render();
}

// ── 篩選工具 ──
// 「案件屬於某月份」定義：startM <= m <= (endM || 12)
function taskInMonth(t,m){
  if(m==='all')return true;
  const mi=parseInt(m);
  return t.startM<=mi&&(t.endM==null||t.endM>=mi);
}

function setView(mode){
  viewMode=mode;
  document.getElementById('vt-all').classList.toggle('on', mode==='active');
  document.getElementById('vt-active').classList.toggle('on', mode==='all');
  render();
}

function filtered(){
  return TASKS.filter(t=>{
    if(viewMode==='active'&&t.archived)return false;
    const mOk=taskInMonth(t,mon);
    const sOk=filt==='all'||(filt==='暫停'&&['暫停','暫停中','暫緩'].includes(t.status))||t.status===filt||(filt==='已完成'&&t.status==='已結案');
    const qOk=!srch||(t.brand+t.name).toLowerCase().includes(srch.toLowerCase());
    return mOk&&sOk&&qOk;
  });
}

// ── 主渲染 ──
function render(){
  const list=filtered();
  renderMetrics(list);
  renderCharts();
  renderCards(list);
  if(activeTab==='gantt')renderGantt();
  if(activeTab==='monthly')renderMonthly();
}

function renderMetrics(list){
  const n=list.length,
    a=list.filter(t=>t.status==='進行中').length,
    d=list.filter(t=>['已完成','已結案'].includes(t.status)).length,
    p=list.filter(t=>['暫停','暫停中','暫緩'].includes(t.status)).length;
  const w=list.filter(t=>t.status==='等待中').length;
  document.getElementById('mRow').innerHTML=`
    <div class="mc" style="--mc:#1a1d23"><div class="mc-l">總案件</div><div class="mc-v">${n}</div><div class="mc-s">目前篩選</div></div>
    <div class="mc" style="--mc:#0f6e56"><div class="mc-l">進行中</div><div class="mc-v">${a}</div><div class="mc-s">${n?Math.round(a/n*100):0}%</div></div>
    <div class="mc" style="--mc:#3b6d11"><div class="mc-l">已完成</div><div class="mc-v">${d}</div><div class="mc-s">${n?Math.round(d/n*100):0}%</div></div>
    <div class="mc" style="--mc:#854f0b"><div class="mc-l">暫停</div><div class="mc-v">${p}</div><div class="mc-s">${n?Math.round(p/n*100):0}%</div></div>
    <div class="mc" style="--mc:#be185d"><div class="mc-l">等待中</div><div class="mc-v">${w}</div><div class="mc-s">${n?Math.round(w/n*100):0}%</div></div>`;
}

function renderCharts(){
  // 所有圖表依照目前 viewMode 篩選後的資料為母體
  const chartData=filtered();
  const bc={};chartData.forEach(t=>{bc[t.brand]=(bc[t.brand]||0)+1;});
  const sorted=Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,9);
  if(cBrand)cBrand.destroy();
  cBrand=new Chart(document.getElementById('cBrand'),{type:'bar',
    data:{labels:sorted.map(x=>x[0]),datasets:[{data:sorted.map(x=>x[1]),backgroundColor:sorted.map(x=>brandColor(x[0])),borderRadius:4,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.raw+' 件'}}},scales:{x:{ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}},y:{ticks:{font:{size:10}}}}}
  });

  // 狀態環形圖
  const sc={};chartData.forEach(t=>{
    let k=t.status;
    if(['已完成','已結案'].includes(k)) k='已完成';
    else if(['暫停','暫停中','暫緩'].includes(k)) k='暫停';
    sc[k]=(sc[k]||0)+1;
  });
  const se=Object.entries(sc);const scols=se.map(([k])=>PC[k]||'#888');
  if(cDonut)cDonut.destroy();
  cDonut=new Chart(document.getElementById('cDonut'),{type:'doughnut',
    data:{labels:se.map(x=>x[0]),datasets:[{data:se.map(x=>x[1]),backgroundColor:scols,borderWidth:2,borderColor:'#fff',hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw} 件`}}}}
  });
  document.getElementById('donutLeg').innerHTML=se.map(([k,v],i)=>`<div class="leg"><div class="legdot" style="background:${scols[i]}"></div>${k} <strong>${v}</strong></div>`).join('');

  // 月份趨勢 — 以 startM 為歸屬（每案件只算一次，不重複）
  const bm=ALL_MONTHS.map(m=>({
    label:ML[m]||m+'月',
    total:chartData.filter(t=>t.startM===m).length,
    active:chartData.filter(t=>t.startM===m&&t.status==='進行中').length,
    done:chartData.filter(t=>t.startM===m&&['已完成','已結案'].includes(t.status)).length,
  }));
  const ml=bm.map(m=>m.label);
  if(cLine)cLine.destroy();
  cLine=new Chart(document.getElementById('cLine'),{type:'line',
    data:{labels:ml,datasets:[{label:'新增案件',data:bm.map(m=>m.total),borderColor:'#EAB308',backgroundColor:'rgba(234,179,8,.08)',tension:.35,pointRadius:4,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}},x:{ticks:{font:{size:10}}}}}
  });
  if(cStack)cStack.destroy();
  cStack=new Chart(document.getElementById('cStack'),{type:'bar',
    data:{labels:ml,datasets:[
      {label:'進行中',data:bm.map(m=>m.active),backgroundColor:'#EAB308',borderRadius:3,stack:'s'},
      {label:'已完成',data:bm.map(m=>m.done),backgroundColor:'#3B82F6',borderRadius:3,stack:'s'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10},boxWidth:10}}},scales:{x:{stacked:true,ticks:{font:{size:10}}},y:{stacked:true,beginAtZero:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}}}}
  });
}

// ── 案件卡片 ──
function renderCards(list){
  const el=document.getElementById('cardList');
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--t3);font-size:13px;">無符合條件的案件</div>';return;}
  el.innerHTML=list.map((t,i)=>{
    const col=PC[t.status]||'#888';
    const stepsHtml=t.steps.length?t.steps.map((s,si)=>{
      const done=si<t.completedSteps,curr=si===t.completedSteps&&t.status==='進行中';
      return `<div class="step"><div class="sdot ${done?'done':curr?'curr':''}">${done?'✓':curr?'▶':''}</div><span class="slbl ${done?'done':curr?'curr':''}">${s}</span></div>`;
    }).join(''):'<div class="empty-note">無步驟資料</div>';
    const logHtml=t.log.length?t.log.slice(0,6).map(l=>`<div class="log"><div class="logdot"></div><div class="logtxt">${l}</div></div>`).join(''):'<div class="empty-note">尚無進度記錄</div>';
    const spanTxt=t.endM?`${ML[t.startM]||t.startM+'月'} → ${ML[t.endM]||t.endM+'月'}`:`${ML[t.startM]||t.startM+'月'} 起`;
    return `<div class="card">
      <div class="card-hd" onclick="toggle(${i})">
        <span class="pill ${SC[t.status]||'ss'}">${t.status||'未填寫'}</span>
        <span class="btag" style="border-color:${brandColor(t.brand)}33;color:${brandColor(t.brand)}">${t.brand}</span>
        <span class="cname">${t.name}</span>
        ${(()=>{const di=deadlineInfo(t.deadline);if(!di)return'';const done=['已完成','已結案'].includes(t.status);const cls=(!done&&di.overdue)?'deadline-overdue':(!done&&di.urgent)?'deadline-urgent':'deadline-ok';const label=(!done&&di.overdue)?`逾期 ${Math.abs(di.days)} 天`:di.days===0&&!done?'今天到期':di.days!=null&&!done?`還有 ${di.days} 天`:'';return `<span class="deadline-tag ${cls}">📅 ${di.txt}${label?' · '+label:''}</span>`})()}
        <span class="clatest">${t.latest||'—'}</span>
        <div class="prow">
          <div class="pbar-bg"><div class="pbar-fg" style="width:${t.pct}%;background:${col}"></div></div>
          <span class="ptxt">${t.pct}%</span>
        </div>
        <span class="chev" id="chev-${i}">▾</span>
      </div>
      <div class="card-bd" id="bd-${i}">
        <div class="bd-prog">
          <div class="bd-pbar"><div class="bd-pfg" style="width:${t.pct}%;background:${col}"></div></div>
          <div class="bd-plabel"><span>${t.steps.length?`第 ${Math.min(t.completedSteps,t.steps.length)} / ${t.steps.length} 步`:'—'}</span><span>${t.pct}% 完成</span></div>
          ${t.waitNote?`<div style="margin-top:8px;padding:8px 12px;background:#fce7f3;border-radius:8px;border-left:3px solid #F472B6"><span style="font-size:11px;font-weight:600;color:#be185d">⏳ 等待中：</span><span style="font-size:12px;color:#9d174d">${t.waitNote}</span></div>`:''}
          ${(()=>{const di=deadlineInfo(t.deadline);if(!di)return'';const done=['已完成','已結案'].includes(t.status);const cls=(!done&&di.overdue)?'deadline-overdue':(!done&&di.urgent)?'deadline-urgent':'deadline-ok';const label=(!done&&di.overdue)?`已逾期 ${Math.abs(di.days)} 天`:di.days===0&&!done?'今天到期':di.days!=null&&!done?`距今 ${di.days} 天`:'';return `<div style="margin-top:6px"><span class="deadline-tag ${cls}" style="font-size:11px;padding:3px 10px">📅 完成期限：${di.txt}　${label}</span></div>`})()}
        </div>
        <div class="bd-grid">
          <div><div class="blbl">執行步驟</div><div class="steps">${stepsHtml}</div></div>
          <div><div class="blbl">進度記錄</div><div class="logs">${logHtml}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i){
  document.getElementById('bd-'+i).classList.toggle('open');
  document.getElementById('chev-'+i).classList.toggle('open');
}

// ── 甘特圖 ──
function renderGantt(){
  const minM=Math.min(...TASKS.map(t=>t.startM));
  const maxM=Math.max(...TASKS.map(t=>t.endM||t.startM),5); // 至少到5月
  const months=[];for(let m=minM;m<=maxM;m++)months.push(m);

  let html=`<table class="gantt-table"><thead><tr>
    <th class="task-col">品牌 / 案件</th>
    ${months.map(m=>`<th class="month-col">${ML[m]||m+'月'}</th>`).join('')}
  </tr></thead><tbody>`;

  TASKS.forEach(t=>{
    const col=PC[t.status]||'#888';
    html+=`<tr>
      <td>
        <div class="gantt-table" style="display:block;padding:0">
          <div class="task-label">${t.name}</div>
          <div class="task-brand-label">${t.brand}${(()=>{const di=deadlineInfo(t.deadline);if(!di)return'';const cls=di.overdue?'color:#b91c1c':di.urgent?'color:#92700a':'color:#9da4ae';return ` · <span style="font-size:10px;${cls}">📅${di.txt}</span>`;})()}</div>
        </div>
      </td>
      ${months.map(m=>{
        const inRange=t.startM<=m&&(t.endM==null||t.endM>=m);
        return `<td class="gantt-bar-cell">${inRange?`<div class="gantt-bar" style="background:${col};opacity:.85" title="${t.name} ${t.pct}%"></div>`:'<div class="gantt-bar empty"></div>'}</td>`;
      }).join('')}
    </tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById('ganttWrap').innerHTML=html;
}

// ── 月份報表 ──
function renderMonthly(){
  // 月份 tab
  document.getElementById('monthTabs').innerHTML=ALL_MONTHS.map(m=>`
    <button class="mtab ${m===curMonthTab?'on':''}" onclick="selectMonth(${m})">${ML[m]||m+'月'}</button>
  `).join('');

  // 本月案件：startM === curMonthTab（該月開始）+ 跨月案件（startM < curMonthTab && 尚未結束）
  const monthTasks=TASKS.filter(t=>taskInMonth(t,curMonthTab));
  const active=monthTasks.filter(t=>t.status==='進行中').length;
  const done=monthTasks.filter(t=>['已完成','已結案'].includes(t.status)).length;
  const paused=monthTasks.filter(t=>['暫停中','暫緩'].includes(t.status)).length;
  const newTasks=TASKS.filter(t=>t.startM===curMonthTab); // 本月新開案

  document.getElementById('monthContent').innerHTML=`
    <div class="month-stats">
      <div class="mc" style="--mc:#0f6e56"><div class="mc-l">${ML[curMonthTab]}執行中案件</div><div class="mc-v">${monthTasks.length}</div><div class="mc-s">含跨月</div></div>
      <div class="mc" style="--mc:#1d9e75"><div class="mc-l">本月新開案</div><div class="mc-v">${newTasks.length}</div><div class="mc-s">startM=${curMonthTab}</div></div>
      <div class="mc" style="--mc:#854f0b"><div class="mc-l">進行中 / 完成</div><div class="mc-v">${active} / ${done}</div><div class="mc-s">暫停 ${paused} 件</div></div>
    </div>
    <div class="cc">
      <div class="cc-t">${ML[curMonthTab]} — 所有執行中案件（含跨月）</div>
      <div class="cards" style="margin-top:8px">
        ${monthTasks.length?monthTasks.map((t,i)=>{
          const col=PC[t.status]||'#888';
          const stepsHtml=t.steps.map((s,si)=>{
            const dn=si<t.completedSteps,cu=si===t.completedSteps&&t.status==='進行中';
            return `<div class="step"><div class="sdot ${dn?'done':cu?'curr':''}">${dn?'✓':cu?'▶':''}</div><span class="slbl ${dn?'done':cu?'curr':''}">${s}</span></div>`;
          }).join('');
          const logHtml=t.log.slice(0,5).map(l=>`<div class="log"><div class="logdot"></div><div class="logtxt">${l}</div></div>`).join('')||'<div class="empty-note">尚無紀錄</div>';
          const spanTxt=t.endM?`${ML[t.startM]}→${ML[t.endM]}`:`${ML[t.startM]}起`;
          return `<div class="card">
            <div class="card-hd" onclick="toggleM('m${curMonthTab}_${i}')">
              <span class="pill ${SC[t.status]||'ss'}">${t.status||'未填寫'}</span>
              <span class="btag" style="border-color:${brandColor(t.brand)}33;color:${brandColor(t.brand)}">${t.brand}</span>
              <span class="cname">${t.name}</span>
              ${(()=>{const di=deadlineInfo(t.deadline);if(!di)return'';const done=['已完成','已結案'].includes(t.status);const cls=(!done&&di.overdue)?'deadline-overdue':(!done&&di.urgent)?'deadline-urgent':'deadline-ok';const label=(!done&&di.overdue)?`逾期${Math.abs(di.days)}天`:di.days===0&&!done?'今天':di.days!=null&&!done?`剩${di.days}天`:'';return `<span class="deadline-tag ${cls}">📅 ${di.txt} ${label}</span>`})()}
              <span class="clatest">${t.latest||'—'}</span>
              <div class="prow">
                <div class="pbar-bg"><div class="pbar-fg" style="width:${t.pct}%;background:${col}"></div></div>
                <span class="ptxt">${t.pct}%</span>
              </div>
              <span class="chev" id="mchev-${curMonthTab}_${i}">▾</span>
            </div>
            <div class="card-bd" id="mbd-${curMonthTab}_${i}">
              <div class="bd-prog">
                <div class="bd-pbar"><div class="bd-pfg" style="width:${t.pct}%;background:${col}"></div></div>
                <div class="bd-plabel"><span>${t.steps.length?`第 ${Math.min(t.completedSteps,t.steps.length)} / ${t.steps.length} 步`:'—'}</span><span>${t.pct}% 完成</span></div>
          ${t.waitNote?`<div style="margin-top:8px;padding:8px 12px;background:#fce7f3;border-radius:8px;border-left:3px solid #F472B6"><span style="font-size:11px;font-weight:600;color:#be185d">⏳ 等待中：</span><span style="font-size:12px;color:#9d174d">${t.waitNote}</span></div>`:''}
                ${(()=>{const di=deadlineInfo(t.deadline);if(!di)return'';const done=['已完成','已結案'].includes(t.status);const cls=(!done&&di.overdue)?'deadline-overdue':(!done&&di.urgent)?'deadline-urgent':'deadline-ok';const label=(!done&&di.overdue)?`已逾期 ${Math.abs(di.days)} 天`:di.days===0&&!done?'今天到期':di.days!=null&&!done?`距今 ${di.days} 天`:'';return `<div style="margin-top:6px"><span class="deadline-tag ${cls}" style="font-size:11px;padding:3px 10px">📅 完成期限：${di.txt}　${label}</span></div>`})()}
          ${(()=>{const di=deadlineInfo(t.deadline);if(!di)return'';const done=['已完成','已結案'].includes(t.status);const cls=(!done&&di.overdue)?'deadline-overdue':(!done&&di.urgent)?'deadline-urgent':'deadline-ok';const label=(!done&&di.overdue)?`已逾期 ${Math.abs(di.days)} 天`:di.days===0&&!done?'今天到期':di.days!=null&&!done?`距今 ${di.days} 天`:'';return `<div style="margin-top:6px"><span class="deadline-tag ${cls}" style="font-size:11px;padding:3px 10px">📅 完成期限：${di.txt}　${label}</span></div>`})()}
              </div>
              <div class="bd-grid">
                <div><div class="blbl">執行步驟</div><div class="steps">${stepsHtml}</div></div>
                <div><div class="blbl">進度記錄</div><div class="logs">${logHtml}</div></div>
              </div>
            </div>
          </div>`;
        }).join(''):'<div style="text-align:center;padding:1.5rem;color:var(--t3);font-size:13px;">本月無執行中案件</div>'}
      </div>
    </div>
  `;
}

function selectMonth(m){curMonthTab=m;renderMonthly();}
function toggleM(id){document.getElementById('mbd-'+id).classList.toggle('open');document.getElementById('mchev-'+id).classList.toggle('open');}

// ── 分頁切換 ──
function switchTab(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab-sec').forEach(s=>s.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tab-'+id).classList.add('on');
  activeTab=id;
  if(id==='gantt')renderGantt();
  if(id==='monthly')renderMonthly();
}

// ── 事件綁定 ──
document.getElementById('mSel').addEventListener('change',e=>{mon=e.target.value;render();});
document.getElementById('srch').addEventListener('input',e=>{srch=e.target.value;render();});
document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');filt=b.dataset.f;render();
}));

loadData();
</script>
